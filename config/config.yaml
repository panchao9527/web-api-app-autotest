# =====================================================================
# 多环境配置文件
# 通过环境变量 ENV (sit/uat/prod) 切换，默认 uat
# 敏感信息(账号密码/token)放 .env，不要写在这里
# =====================================================================

# 公共配置（所有环境共享）
common:
  timeout: 30                # 默认超时(秒)
  retry: 0                   # 默认不重试；仅对已登记的幂等操作显式配置
  log_level: INFO
  log_response: true         # 是否在日志中打印接口返回报文(全局开关)
  log_response_max: 1000     # 返回报文最大打印长度，超出自动截断(防大报文刷屏)

# 各环境配置
sit:
  api_base_url: "https://sit-api.example.com"
  web_base_url: "https://sit.example.com"
  boss:
    storage_state: ".auth/boss-sit.json"
  db:
    host: "sit-db.example.com"
    port: 3306
    name: "app_db"
  redis:
    host: "sit-redis.example.com"
    port: 6379
    db: 0

uat:
  api_base_url: "https://uat-api.example.com"
  web_base_url: "https://boss.uat.mcdonalds.cn"
  boss:
    storage_state: ".auth/boss-uat.json"
  db:
    host: "uat-db.example.com"
    port: 3306
    name: "app_db"
  redis:
    host: "uat-redis.example.com"
    port: 6379
    db: 0

prod:
  api_base_url: "https://api.example.com"
  web_base_url: "https://www.example.com"
  boss:
    storage_state: ".auth/boss-prod.json"
  db:
    host: "prod-db.example.com"
    port: 3306
    name: "app_db"
  redis:
    host: "prod-redis.example.com"
    port: 6379
    db: 0

# Web (Playwright) 配置
web:
  browser: "chromium"        # chromium / firefox / webkit
  headless: true             # CI 上为 true，本地调试可设 false
  slow_mo: 0                 # 操作放慢(毫秒)，调试用
  viewport:
    width: 1920
    height: 1080
  trace: true                # 失败时保留 trace 便于回放

# App (Appium) 配置
app:
  appium_server: "http://127.0.0.1:4723"
  manage_server: true           # true = 测试启动时自动管理本机 Appium Server
  platform: "Android"        # Android / iOS
  android:
    platformName: "Android"
    automationName: "UiAutomator2"
    deviceName: "Android Emulator"  # 仅作描述；选择设备请使用 avd 或 APPIUM_UDID
    avd: "Pixel_6_API_34"
    noReset: false              # 默认保持用例隔离；需要复用登录态时再按项目调整
    autoGrantPermissions: true
    newCommandTimeout: 120
    adbExecTimeout: 60000
    avdLaunchTimeout: 120000
    avdReadyTimeout: 120000
  ios:
    platformName: "iOS"
    automationName: "XCUITest"
    deviceName: "iPhone 15"
    platformVersion: "17.0"
    bundleId: "com.example.app"


# 测试结果通知（webhook/邮箱等敏感信息放 .env）
notify:
  send_on_finish: false      # true = 测试跑完自动推送结果摘要到已配置渠道(建议 CI 开启; 本地保持 false)
  report_url: ""             # 报告地址(显示在通知里；CI 可用环境变量 REPORT_URL 覆盖)
