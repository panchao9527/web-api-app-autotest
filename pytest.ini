[pytest]
# 默认只运行离线框架自测；真实业务测试请使用 scripts/automation.py
testpaths = tests/framework

# 用例文件/类/函数命名规则
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 默认运行参数
addopts =
    -v
    --alluredir=./reports/allure-results
    --clean-alluredir
    --strict-markers

# 自定义标记 (按层级/优先级分类，方便选择执行)
markers =
    smoke: 冒烟用例 (P0 核心链路)
    regression: 回归用例
    api: 接口测试
    web: Web UI 测试
    app: App 测试
    prod_safe: 允许在获得双重授权后于生产环境执行的只读测试
    flaky: 已登记的不稳定用例，可在显式命令中单独启用重试
    p0: 最高优先级
    p1: 高优先级
    p2: 中优先级

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
