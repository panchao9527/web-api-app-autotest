name: Automation Tests

# 触发：push/PR 到 main，以及每天定时回归
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"   # 每天 02:00 UTC 跑全量回归
  workflow_dispatch:       # 支持手动触发

jobs:
  # ---------------- 接口测试 ----------------
  api-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行接口测试
        env:
          ENV: uat
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: pytest -m api --alluredir=./reports/allure-results --junitxml=./reports/junit-api.xml

      - name: 上传 Allure 结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: reports/allure-results

      - name: 上传 junit 结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-api
          path: reports/junit-api.xml

  # ---------------- Web UI 测试 ----------------
  web-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 安装 Playwright 浏览器
        run: playwright install --with-deps chromium

      - name: 运行 Web 测试
        env:
          ENV: uat
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: pytest -m web --alluredir=./reports/allure-results --junitxml=./reports/junit-web.xml

      - name: 上传 Allure 结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-web
          path: reports/allure-results

      - name: 上传 junit 结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-web
          path: reports/junit-web.xml

  # ---------------- 生成并发布 Allure 报告 ----------------
  report:
    needs: [api-test, web-test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: 下载所有 Allure 结果
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: all-results

      - name: 合并结果
        run: |
          mkdir -p reports/allure-results
          find all-results -type f -exec cp {} reports/allure-results/ \;

      - name: 生成 Allure 报告
        uses: simple-elf/allure-report-action@v1.7
        with:
          allure_results: reports/allure-results
          allure_report: allure-report

      - name: 发布到 GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report

  # ---------------- 汇总结果并推送通知(钉钉/企微/邮件) ----------------
  notify:
    needs: [api-test, web-test, report]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安装通知依赖
        run: pip install requests PyYAML python-dotenv loguru jsonpath-ng

      - name: 下载 junit 结果
        uses: actions/download-artifact@v4
        with:
          pattern: junit-*
          path: junit

      - name: 汇总并推送测试结果
        env:
          ENV: uat
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # 报告地址(GitHub Pages)，按你的仓库替换
          REPORT_URL: https://panchao9527.github.io/web-api-app-autotest/
        run: python scripts/notify_from_junit.py junit
