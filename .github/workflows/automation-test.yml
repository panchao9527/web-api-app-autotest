name: Automation Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 18 * * *" # 北京时间每天 02:00
  workflow_dispatch:

permissions:
  contents: write

env:
  ENV: uat
  TEST_MARKER: ${{ github.event_name == 'schedule' && 'regression' || 'smoke' }}

jobs:
  framework-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: 静态检查
        if: matrix.python-version == '3.12'
        run: |
          python -m ruff format --check .
          python -m ruff check .
      - name: 离线框架自测
        env:
          PYTEST_ADDOPTS: --alluredir=reports/allure-framework --clean-alluredir --junitxml=reports/junit-framework.xml
        run: python scripts/automation.py self-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-framework-${{ matrix.python-version }}
          path: reports/allure-framework
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-framework-${{ matrix.python-version }}
          path: reports/junit-framework.xml
          if-no-files-found: ignore

  api-test:
    needs: framework-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-api.txt
      - name: 运行 API 测试
        env:
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          PYTEST_ADDOPTS: --alluredir=reports/allure-api --clean-alluredir --junitxml=reports/junit-api.xml
        run: python scripts/automation.py test --type api --env uat --marker "$TEST_MARKER"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-api
          path: reports/allure-api
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-api
          path: reports/junit-api.xml
          if-no-files-found: ignore

  web-test:
    needs: framework-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-web.txt
      - run: playwright install --with-deps chromium
      - name: 运行 Web 测试
        env:
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          PYTEST_ADDOPTS: --alluredir=reports/allure-web --clean-alluredir --junitxml=reports/junit-web.xml
        run: python scripts/automation.py test --type web --env uat --marker "$TEST_MARKER"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-web
          path: reports/allure-web
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-web
          path: reports/junit-web.xml
          if-no-files-found: ignore

  report:
    needs: [framework-test, api-test, web-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: reports/allure-results
          merge-multiple: true
      - uses: simple-elf/allure-report-action@v1.7
        with:
          allure_results: reports/allure-results
          allure_report: allure-report
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report

  notify:
    needs: [framework-test, api-test, web-test, report]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-api.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: junit-*
          path: junit
          merge-multiple: true
      - name: 汇总并推送
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python scripts/notify_from_junit.py junit
