# =====================================================================
# GitLab CI 流水线（与 .github/workflows/automation-test.yml 等价）
# 阶段: test(接口+Web) -> report(生成Allure发布Pages) -> notify(汇总推送)
#
# 【使用前准备】在 项目 Settings -> CI/CD -> Variables 里配置(按需)：
#   TEST_USERNAME / TEST_PASSWORD    测试账号
#   DINGTALK_WEBHOOK / WECOM_WEBHOOK  通知机器人
#   SMTP_HOST/SMTP_PORT/SMTP_USER/SMTP_PASSWORD/EMAIL_TO  邮件
#   DB_USER/DB_PASSWORD/REDIS_PASSWORD  (如用到)
# 这些变量会自动注入到各 job 的环境变量，无需在下面重复声明。
# =====================================================================

stages:
  - test
  - report
  - notify

variables:
  ENV: "uat"

# ---------------- 接口测试 ----------------
api-test:
  stage: test
  image: python:3.12
  before_script:
    - pip install -r requirements.txt
  script:
    - pytest -m api --alluredir=reports/allure-results --junitxml=reports/junit-api.xml
  artifacts:
    when: always
    paths:
      - reports/allure-results
      - reports/junit-api.xml
    reports:
      junit: reports/junit-api.xml

# ---------------- Web 测试(用 Playwright 官方镜像，自带浏览器) ----------------
web-test:
  stage: test
  image: mcr.microsoft.com/playwright/python:v1.49.1-jammy
  before_script:
    - pip install -r requirements.txt
  script:
    - pytest -m web --alluredir=reports/allure-results --junitxml=reports/junit-web.xml
  artifacts:
    when: always
    paths:
      - reports/allure-results
      - reports/junit-web.xml
    reports:
      junit: reports/junit-web.xml

# ---------------- 生成 Allure 报告并发布到 GitLab Pages ----------------
pages:
  stage: report
  image: eclipse-temurin:17-jre
  when: always
  dependencies:
    - api-test
    - web-test
  before_script:
    - apt-get update -qq && apt-get install -y -qq npm > /dev/null
    - npm install -g allure-commandline --silent
  script:
    # GitLab Pages 固定发布 public/ 目录，访问地址见 $CI_PAGES_URL
    - allure generate reports/allure-results --clean -o public
  artifacts:
    paths:
      - public

# ---------------- 汇总结果并推送(钉钉/企微/邮件) ----------------
notify:
  stage: notify
  image: python:3.12
  when: always
  dependencies:
    - api-test
    - web-test
  variables:
    # GitLab 内置变量，Pages 报告地址；也可改成公司自建报告地址
    REPORT_URL: "$CI_PAGES_URL"
  before_script:
    - pip install requests PyYAML python-dotenv loguru jsonpath-ng
  script:
    - python scripts/notify_from_junit.py reports
