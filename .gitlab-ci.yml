stages:
  - quality
  - test
  - report
  - notify

variables:
  ENV: "uat"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

.test-rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      variables:
        TEST_MARKER: "regression"
    - when: on_success
      variables:
        TEST_MARKER: "smoke"

framework-test:
  timeout: 30m
  stage: quality
  image: python:3.12
  before_script:
    - pip install -r requirements.txt
  script:
    - python -m ruff format --check .
    - python -m ruff check .
    - PYTEST_ADDOPTS="--alluredir=reports/allure-framework --clean-alluredir --junitxml=reports/junit-framework.xml" python scripts/automation.py self-test
  artifacts:
    when: always
    paths:
      - reports/allure-framework
      - reports/junit-framework.xml
    reports:
      junit: reports/junit-framework.xml

api-test:
  timeout: 45m
  extends: .test-rules
  stage: test
  image: python:3.12
  needs: [framework-test]
  before_script:
    - pip install -r requirements.txt
  script:
    - PYTEST_ADDOPTS="--alluredir=reports/allure-api --clean-alluredir --junitxml=reports/junit-api.xml" python scripts/automation.py test --type api --env uat --marker "$TEST_MARKER"
  artifacts:
    when: always
    paths:
      - reports/allure-api
      - reports/junit-api.xml
    reports:
      junit: reports/junit-api.xml

web-test:
  timeout: 45m
  extends: .test-rules
  stage: test
  image: mcr.microsoft.com/playwright/python:v1.49.1-jammy
  needs: [framework-test]
  before_script:
    - pip install -r requirements.txt
  script:
    - PYTEST_ADDOPTS="--alluredir=reports/allure-web --clean-alluredir --junitxml=reports/junit-web.xml" python scripts/automation.py test --type web --env uat --marker "$TEST_MARKER"
  artifacts:
    when: always
    paths:
      - reports/allure-web
      - reports/junit-web.xml
    reports:
      junit: reports/junit-web.xml

pages:
  timeout: 15m
  stage: report
  image: eclipse-temurin:17-jre
  when: always
  needs:
    - job: framework-test
      artifacts: true
    - job: api-test
      artifacts: true
    - job: web-test
      artifacts: true
  before_script:
    - apt-get update -qq && apt-get install -y -qq npm > /dev/null
    - npm install -g allure-commandline --silent
  script:
    - mkdir -p reports/allure-results
    - cp -r reports/allure-framework/. reports/allure-results/ || true
    - cp -r reports/allure-api/. reports/allure-results/ || true
    - cp -r reports/allure-web/. reports/allure-results/ || true
    - allure generate reports/allure-results --clean -o public
  artifacts:
    paths: [public]

notify:
  timeout: 10m
  stage: notify
  image: python:3.12
  when: always
  needs:
    - job: framework-test
      artifacts: true
    - job: api-test
      artifacts: true
    - job: web-test
      artifacts: true
  variables:
    REPORT_URL: "$CI_PAGES_URL"
  before_script:
    - pip install -r requirements.txt
  script:
    - python scripts/notify_from_junit.py reports
